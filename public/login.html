<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dialeco Login</title>
  <style>
    body {
      margin: 0;
      font-family: 'Avenir Next', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: white;
    }

    .login-container {
      width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 128px;
      font-weight: 700;
      text-align: center;
    }

    .logo .blue {
      color: #102E63;
    }

    .logo .green {
      color: #62BD5D;
    }

    .input-label {
      font-size: 16px;
      font-weight: 700;
      color: black;
      align-self: flex-start;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      border: 2px solid #102E63;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .sign-in-button {
      width: 100%;
      padding: 12px;
      font-size: 24px;
      font-weight: 700;
      color: white;
      background-color: #102E63;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .sign-in-button:hover:not(:disabled) {
      background-color: #0d2450;
    }

    .sign-in-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .google-button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #1f1f1f;
      background-color: #ffffff;
      border: 2px solid #dadce0;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .google-button:hover:not(:disabled) {
      background-color: #f8f9fa;
      border-color: #c6c6c6;
    }

    .google-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .divider {
      width: 100%;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin: -4px 0;
    }

    .google-icon {
      display: inline-flex;
      width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
    }

    .error-message {
      color: #d32f2f;
      font-size: 14px;
      text-align: center;
      display: none;
      padding: 8px;
      background-color: #ffebee;
      border-radius: 5px;
      width: 100%;
      box-sizing: border-box;
    }

    .sign-up-link {
      font-size: 13px;
      font-weight: 400;
      color: black;
      text-align: center;
      cursor: pointer;
    }

    .sign-up-link:hover {
      color: #102E63;
      text-decoration: underline;
    }

    .toggle-auth {
      color: #102E63;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <span class="blue">Dialec</span><span class="green">o</span>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <label class="input-label" for="email">Email</label>
    <input type="email" id="email" class="input-box" placeholder="your@email.com" required />

    <label class="input-label" for="password">Password</label>
    <input type="password" id="password" class="input-box" placeholder="Enter password" required />

    <div id="usernameField" style="display: none; width: 100%;">
      <label class="input-label" for="username">Username</label>
      <input type="text" id="username" class="input-box" placeholder="Choose a username" />
    </div>

    <button class="sign-in-button" id="authButton" onclick="handleAuth()">Sign In</button>

    <div class="divider">or</div>

    <button class="google-button" id="googleButton" onclick="handleGoogleAuth()" type="button">
      <span class="google-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 533.5 544.3" focusable="false" role="img">
          <path fill="#4285F4" d="M533.5 278.4c0-17.8-1.6-35-4.8-51.7H272v97.8h147.4c-6.4 34.8-25 64.4-53.4 84.2v69.9h86.1c50.5-46.6 81.4-115 81.4-200.2z"/>
          <path fill="#34A853" d="M272 544.3c72.6 0 133.7-24.1 178.2-65.4l-86.1-69.9c-24 16.1-54.8 25.6-92.1 25.6-70.8 0-130.7-47.9-152.2-112.1H33.4v70.4C77 493.9 168.3 544.3 272 544.3z"/>
          <path fill="#FBBC05" d="M119.8 325.1c-10.8-32.1-10.8-66.8 0-98.9V155.8H33.4c-36.8 73.7-36.8 161.5 0 235.2l86.4-65.9z"/>
          <path fill="#EA4335" d="M272 107.7c39.5 0 75 13.6 102.9 40.3l77.1-77.1C405.7 24.6 344.6 0 272 0 168.3 0 77 50.4 33.4 126.7l86.4 70.4C141.3 155.6 201.2 107.7 272 107.7z"/>
        </svg>
      </span>
      <span>Continue with Google</span>
    </button>

    <div class="sign-up-link">
      <span id="toggleText">Don't have an account?</span> 
      <span class="toggle-auth" onclick="toggleAuthMode()">Sign Up Here</span>
    </div>
  </div>

  <script src="./firebaseConfig.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.2.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.2.0/firebase-auth.js";

    const app = initializeApp(window.firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let isSignUpMode = false;

    async function registerUserProfile(token, email, username) {
      return fetch('http://localhost:3000/api/auth/register', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ email, username })
      }).catch(err => {
        console.warn('Backend registration failed (non-blocking):', err);
      });
    }

    // Make functions globally available
    window.toggleAuthMode = function() {
      isSignUpMode = !isSignUpMode;
      const button = document.getElementById('authButton');
      const toggleText = document.getElementById('toggleText');
      const usernameField = document.getElementById('usernameField');
      
      if (isSignUpMode) {
        button.textContent = 'Sign Up';
        toggleText.textContent = 'Already have an account?';
        usernameField.style.display = 'block';
      } else {
        button.textContent = 'Sign In';
        toggleText.textContent = "Don't have an account?";
        usernameField.style.display = 'none';
      }
      hideError();
    };

    window.handleAuth = async function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value.trim();
      const button = document.getElementById('authButton');

      // Validation
      if (!email || !password) {
        showError('Please fill in all fields');
        return;
      }

      if (isSignUpMode && !username) {
        showError('Please enter a username');
        return;
      }

      // Disable button and show loading
      button.disabled = true;
      button.textContent = isSignUpMode ? 'Creating Account...' : 'Signing In...';
      hideError();

      try {
        if (isSignUpMode) {
          // Sign Up
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          
          // Update profile with username
          await updateProfile(userCredential.user, {
            displayName: username
          });

          // Try to send user data to backend (non-blocking)
          const token = await userCredential.user.getIdToken();
          registerUserProfile(token, email, username);

          // Store user data in localStorage
          localStorage.setItem('dialeco_user', JSON.stringify({
            uid: userCredential.user.uid,
            email: userCredential.user.email,
            username: username
          }));

          // Store token
          localStorage.setItem('dialeco_token', token);

          // Redirect to dashboard after short delay
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 500);

        } else {
          // Sign In
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          
          // Get and store token
          const token = await userCredential.user.getIdToken();
          localStorage.setItem('dialeco_token', token);
          localStorage.setItem('dialeco_user', JSON.stringify({
            uid: userCredential.user.uid,
            email: userCredential.user.email,
            username: userCredential.user.displayName
          }));

          // Redirect to dashboard after short delay
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 500);
        }

      } catch (error) {
        console.error('Authentication error:', error);
        
        // Handle different error codes
        let errorMessage = 'An error occurred. Please try again.';
        
        if (error.code === 'auth/email-already-in-use') {
          errorMessage = 'This email is already registered. Please sign in.';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'Invalid email address.';
        } else if (error.code === 'auth/weak-password') {
          errorMessage = 'Password should be at least 6 characters.';
        } else if (error.code === 'auth/user-not-found') {
          errorMessage = 'No account found with this email.';
        } else if (error.code === 'auth/wrong-password') {
          errorMessage = 'Incorrect password.';
        }
        
        showError(errorMessage);
        button.disabled = false;
        button.textContent = isSignUpMode ? 'Sign Up' : 'Sign In';
      }
    };

    window.handleGoogleAuth = async function() {
      const googleButton = document.getElementById('googleButton');
      const previousLabel = googleButton.textContent;

      googleButton.disabled = true;
      googleButton.textContent = 'Connecting to Google...';
      hideError();

      try {
        const userCredential = await signInWithPopup(auth, googleProvider);
        const user = userCredential.user;
        const token = await user.getIdToken();
        const username = user.displayName || (user.email ? user.email.split('@')[0] : 'User');

        localStorage.setItem('dialeco_token', token);
        localStorage.setItem('dialeco_user', JSON.stringify({
          uid: user.uid,
          email: user.email,
          username
        }));

        if (user.email) {
          registerUserProfile(token, user.email, username);
        }

        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error('Google authentication error:', error);

        let errorMessage = 'Google sign-in failed. Please try again.';
        if (error.code === 'auth/popup-closed-by-user') {
          errorMessage = 'Google sign-in was cancelled.';
        } else if (error.code === 'auth/popup-blocked') {
          errorMessage = 'Popup was blocked. Please allow popups and try again.';
        }

        showError(errorMessage);
        googleButton.disabled = false;
        googleButton.textContent = previousLabel;
      }
    };

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    function hideError() {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.style.display = 'none';
    }

    // Allow Enter key to submit
    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        handleAuth();
      }
    });
  </script>
</body>
</html>
