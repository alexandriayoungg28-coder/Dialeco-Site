<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cultural Videos – Dialeco</title>
  <style>
    body {
      margin: 0;
      font-family: "Avenir Next", sans-serif;
      background: #ffffff;
    }

    .container {
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      max-width: 1728px;
      margin: auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 106px;
      border-bottom: 2px solid #eee;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
    }

    .logo-text-blue {
      color: #102E63;
    }

    .logo-text-green {
      color: #62BD5D;
    }

    /* Profile pic container (header) */
    .profile-pic {
      width: 65px;
      height: 65px;
      border-radius: 9999px;
      background: #D9D9D9;
      overflow: hidden;
      flex-shrink: 0;
    }

    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 9999px;
    }

    /* Header right section with survey icon */
    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .survey-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 180, 216, 0.2);
    }

    .survey-icon:hover {
      background: linear-gradient(135deg, #0096c7, #005f87);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 180, 216, 0.3);
    }

    .survey-icon svg {
      width: 26px;
      height: 26px;
      fill: white;
    }

    .main-card {
      background: white;
      border: 2px solid #62BD5D;
      border-radius: 15px;
      padding: 40px;
      margin-top: 40px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-text-blue">Dialec</span><span class="logo-text-green">o</span>
      </div>
      <div class="header-right">
        <!-- Survey Icon -->
        <div class="survey-icon" onclick="goToSurvey()" title="Feedback">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
          </svg>
        </div>
        <!-- Use profile.png here -->
        <div class="profile-pic">
          <img src="culturalvideos-images/profile.png" alt="Profile">
        </div>
      </div>
    </header>

    <!-- Main Card -->
    <div class="main-card">
      <h1 class="title">Cultural Videos</h1>
