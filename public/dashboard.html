<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dialeco Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      font-family: "Avenir Next", sans-serif;
      background-color: white;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      border-bottom: 2px solid #eee;
    }

    .logo {
      font-size: 2.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
    }

    .logo {
      cursor: default;
      color: #102E63;
    }

    .logo span:last-child {
      color: #62BD5D;
    }

    .profile-img {
      width: 65px;
      height: 65px;
      border-radius: 9999px;
      background: #D9D9D9;
    }

    .main {
      display: flex;
      padding: 2rem;
      gap: 2rem;
    }

    .image-column {
      position: relative;
      width: 790px;
      height: 952px;
      border-radius: 15px;
      overflow: hidden;
    }

    .image-column img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      display: block;
      transition: opacity 1s ease-in-out;
      opacity: 1;
    }

    .overlay-text {
      position: absolute;
      top: 20px;
      width: 100%;
      color: #FFF;
      text-align: center;
      font-family: "Avenir Next", sans-serif;
      font-size: 128px;
      font-weight: 700;
      line-height: normal;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 0 5px rgba(0,0,0,0.6);
    }

    .cards-column {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex-grow: 1;
    }

    .card {
      position: relative;
      background-color: #737373;
      color: white;
      border-radius: 15px;
      padding: 2rem;
      font-size: 2.5rem;
      font-weight: 700;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: default;
    }

    .card.audio {
      background-color: #102E63;
      cursor: pointer;
    }

    .card.audio:hover {
      background-color: #0d2450;
    }

    .card.audio .arrow {
      font-size: 3rem;
      color: white;
      margin-right: 1rem;
    }

    .gray-box {
      width: 60px;
      height: 60px;
      background-color: #D9D9D9;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gray-box i {
      font-size: 2rem;
      color: white;
    }

    a.card-link {
      text-decoration: none;
    }

    @media (max-width: 1100px) {
      .main {
        flex-direction: column;
        align-items: center;
      }

      .image-column {
        width: 100%;
        height: auto;
      }

      .image-column img {
        height: auto;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <span>Dialec</span><span>o</span>
    </div>
    <img class="profile-img" src="dashboard-images/profile.png" alt="Profile Image" />
  </div>

  <div class="main">
    <div class="image-column">
      <img id="peru-image" src="dashboard-images/peru1.png" alt="Peru Image" />
      <div class="overlay-text">Perú</div>
    </div>

    <div class="cards-column">
      <!-- Audio Pod -->
      <a class="card-link" href="/audio-pod">
        <div class="card audio">
          Audio Pod
          <i class="fas fa-angles-right arrow"></i>
        </div>
      </a>

      <!-- Reading -->
      <div class="card">
        Cultural Videos 
        <div class="gray-box"><i class="fas fa-lock"></i></div>
      </div>

      <!-- Writing -->
      <div class="card">
        Peer Exchange 
        <div class="gray-box"><i class="fas fa-lock"></i></div>
      </div>

     
      </div>
    </div>
  </div>

  <script>
    const images = [
      "dashboard-images/peru1.png",
      "dashboard-images/peru2.png",
      "dashboard-images/peru3.png",
      "dashboard-images/peru4.png"
    ];

    let currentIndex = 0;
    const imageElement = document.getElementById("peru-image");

    setInterval(() => {
      // Fade out
      imageElement.style.opacity = 0;

      setTimeout(() => {
        // Change image after fade-out
        currentIndex = (currentIndex + 1) % images.length;
        imageElement.src = images[currentIndex];

        // Fade in
        imageElement.style.opacity = 1;
      }, 1000); // matches CSS transition duration
    }, 4000); // every 4 seconds
  </script>

</body>
</html>
